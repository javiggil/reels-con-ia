<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/>
<title>Ejemplo hook OPACO - bandeja que se escanea</title>
<link rel="stylesheet" href="demo.css"/>
<style>
  html,body{background:#F4EFE6;}
  #canvas{width:2300px;height:1700px;}
  .dots{left:-3000px;top:-3000px;width:8000px;height:8000px;}
  /* TODO el estilo va por CLASE: la copia del sistema es un clon sin ids */
  .sysw{position:absolute;left:0;top:0;}
  .post{left:0;top:0;width:760px;height:1044px;}
  .pav{position:absolute;left:28px;top:28px;width:84px;height:84px;border-radius:18px;background:#354B98;box-shadow:0 0 0 3px #1C1A17;}
  .pav svg{width:84px;height:84px;display:block;}
  .bar{position:absolute;height:14px;border-radius:7px;background:#D9CDB9;}
  .bar.dk{background:#1C1A17;}
  .pimg{position:absolute;left:28px;top:210px;width:704px;height:228px;border-radius:16px;background:#EFE6D6;box-shadow:inset 0 0 0 3px #1C1A17;overflow:hidden;}
  .pimg svg{width:704px;height:228px;display:block;}
  .rx{position:absolute;top:462px;width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #FFFDF8;}
  .rx svg{width:44px;height:44px;display:block;}
  .cbtn{position:absolute;left:652px;top:456px;width:64px;height:56px;}
  .cbtn svg{width:64px;height:56px;display:block;}
  .cdot{position:absolute;left:700px;top:446px;width:28px;height:28px;border-radius:50%;background:#fe4629;box-shadow:0 0 0 3px #FFFDF8;}
  .div{position:absolute;left:28px;top:528px;width:704px;height:3px;background:#E2D8C6;}

  .cm{position:absolute;left:28px;width:704px;height:88px;}
  .cm .av{left:0;top:12px;width:66px;height:66px;}
  .cm .bub{position:absolute;left:86px;top:0;width:618px;height:88px;border-radius:20px;background:#F5EFE4;box-shadow:inset 0 0 0 3px #E2D8C6;}
  .cm.hit .bub{background:#FFF1EC;box-shadow:inset 0 0 0 4px #fe4629;}
  .cm.off{opacity:.3;filter:grayscale(1);}
  .ret{position:absolute;left:-17px;top:-5px;width:100px;height:100px;}
  .ret svg{width:100px;height:100px;display:block;overflow:visible;}

  .kc{position:absolute;left:1000px;width:640px;height:148px;border-radius:24px;}
  .kc .av{left:24px;top:24px;width:100px;height:100px;}
  .kc .ic{position:absolute;left:152px;width:46px;height:46px;}
  .kc .ic svg{width:46px;height:46px;display:block;}
  .kc .ok{position:absolute;left:560px;top:44px;width:60px;height:60px;border-radius:50%;background:#2ece7d;box-shadow:0 0 0 3px #1C1A17;}
  .kc .ok svg{width:60px;height:60px;display:block;}
  .wires{position:absolute;left:0;top:0;width:2300px;height:1100px;overflow:visible;pointer-events:none;}

  .chart{position:absolute;left:1780px;top:540px;width:500px;height:500px;}
  .cb{position:absolute;bottom:0;width:46px;border-radius:10px 10px 4px 4px;background:#1C1A17;transform-origin:50% 100%;}
  .cb.last{background:#2ece7d;box-shadow:0 0 0 4px #1C1A17;}
  .cbase{position:absolute;left:-12px;right:-12px;bottom:-6px;height:7px;border-radius:4px;background:#1C1A17;}

  /* escáner */
  #scan{position:absolute;left:-40px;top:520px;width:840px;height:150px;pointer-events:none;}
  #scan .trail{position:absolute;left:0;right:0;bottom:4px;height:146px;background:linear-gradient(to bottom, rgba(254,70,41,0) 0%, rgba(254,70,41,.22) 100%);}
  #scan .beam{position:absolute;left:0;right:0;bottom:0;height:8px;border-radius:4px;background:#fe4629;box-shadow:0 0 18px 6px rgba(254,70,41,.55);}

  .fly{position:absolute;width:66px;height:66px;z-index:20;}
  #sel{position:absolute;left:-90px;top:-40px;width:2400px;height:1124px;border:10px solid #354B98;border-radius:10px;pointer-events:none;}
  #sel i{position:absolute;width:44px;height:44px;background:#FFFDF8;border:10px solid #354B98;border-radius:6px;}
  #copyWrap{position:absolute;left:0;top:0;}
  .rim{position:absolute;left:-90px;top:-40px;width:2400px;height:1124px;border:12px solid #fe4629;border-radius:24px;pointer-events:none;
       background:rgba(244,239,230,.55);}
  #plus{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:#2ece7d;box-shadow:0 0 0 3px #1C1A17;z-index:41;}
  #plus svg{width:46px;height:46px;display:block;}
</style></head>
<body>
<div id="root" data-composition-id="c00" data-start="0" data-duration="6.007" data-width="2160" data-height="3840">
  <div id="stage" class="clip" data-start="0" data-duration="6.007" data-track-index="1">
    <div class="paper"></div>
    <div class="world" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="dotcam"><div class="dots"></div></div>
      <div id="vp" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="cam"><div id="canvas" data-layout-allow-overflow data-layout-allow-overlap>
        <div class="glow green" id="gChart" style="left:1760px;top:300px;width:560px;height:560px;"></div>

        <div class="sysw" id="sys">
          <svg class="wires" id="wires" viewBox="0 0 2300 1100" fill="none"></svg>
          <div class="ui-card post" id="post">
            <div class="pav"><svg viewBox="0 0 84 84"><path d="M22 60 L42 22 L62 60 Z" fill="#FFFDF8"/><circle cx="42" cy="51" r="7" fill="#fe4629"/></svg></div>
            <div class="bar dk" style="left:134px;top:42px;width:230px;height:18px;"></div>
            <div class="bar" style="left:134px;top:76px;width:150px;height:12px;"></div>
                        <div class="bar" style="left:28px;top:142px;width:704px;"></div>
            <div class="bar" style="left:28px;top:172px;width:560px;"></div>
            <div class="pimg"><svg viewBox="0 0 704 228">
              <path d="M40 190 L150 160 L250 172 L360 118 L470 104 L580 52 L650 34" stroke="#354B98" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="650" cy="34" r="16" fill="#fe4629" stroke="#1C1A17" stroke-width="5"/>
              <rect x="40" y="206" width="624" height="5" rx="2.5" fill="#1C1A17" opacity=".2"/></svg></div>
            <div class="rx" style="left:28px;"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#354B98"/><path d="M10 16 h4 v9 h-4z M15 16 l4-7 c2 0 3 1 2 4 l-1 3 h5 c1 0 2 1 1 2 l-2 6 c0 1-1 1-2 1 h-7z" fill="#FFFDF8"/></svg></div>
            <div class="rx" style="left:62px;"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#fe4629"/><path d="M17 25 C7 18 9 10 13.5 10 C15.5 10 17 12 17 12 C17 12 18.5 10 20.5 10 C25 10 27 18 17 25Z" fill="#FFFDF8"/></svg></div>
            <div class="rx" style="left:96px;"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#2ece7d"/><circle cx="17" cy="15" r="6" fill="#FFFDF8"/><path d="M9 26 q8-7 16 0" stroke="#FFFDF8" stroke-width="3" fill="none"/></svg></div>
            <div class="bar" style="left:156px;top:478px;width:110px;height:12px;"></div>
            <div class="cbtn"><svg viewBox="0 0 64 56"><path d="M6 6 H58 V40 H28 L14 52 V40 H6 Z" fill="#FFFDF8" stroke="#1C1A17" stroke-width="5" stroke-linejoin="round"/><rect x="16" y="17" width="32" height="5" rx="2.5" fill="#1C1A17"/><rect x="16" y="27" width="20" height="5" rx="2.5" fill="#1C1A17"/></svg></div>
            <div class="cdot" id="cdot"></div>
            <div class="div"></div>
            <div id="cms"></div>
            <div class="sheen" id="sh0"></div>
          </div>
          <div id="kcs"></div>
          <div class="chart" id="chart"><div class="cbase" id="cbase"></div></div>
        </div>

        <div id="scan"><div class="trail"></div><div class="beam"></div></div>
        <div id="flys"></div>
        <div id="sel"><i style="left:-27px;top:-27px"></i><i style="right:-27px;top:-27px"></i><i style="left:-27px;bottom:-27px"></i><i style="right:-27px;bottom:-27px"></i>
          <i style="left:calc(50% - 27px);top:-27px"></i><i style="left:calc(50% - 27px);bottom:-27px"></i><i style="left:-27px;top:calc(50% - 27px)"></i><i style="right:-27px;top:calc(50% - 27px)"></i></div>
        <div id="fx"></div>
        <div class="mascota-box" id="mbox"><!--MASCOT--></div>
      </div></div>
      </div>
      <div class="cursor" id="cur"></div>
      <div id="plus"><svg viewBox="0 0 46 46"><path d="M23 12 V34 M12 23 H34" stroke="#1C1A17" stroke-width="5" stroke-linecap="round"/></svg></div>
    </div>
  </div>
</div>

<script src="gsap.min.js"></script><!-- GSAP: lo copia scaffold.sh desde _kit/ (origen: cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js) -->
<script src="demo.js"></script>
<script>
window.__timelines = window.__timelines || {};
var DUR = 6.007, FX = 480, FY = 900;
var $ = function(id){ return document.getElementById(id); };
var NS = 'http://www.w3.org/2000/svg';

/* ---------- filas (mensajes) dentro de la tarjeta */
var HIT = [0,2,3], CMY = function(i){ return 548 + i*100; };
for (var i=0;i<5;i++){
  var d = document.createElement('div'); var hit = HIT.indexOf(i)>=0;
  d.className = 'cm' + (hit ? ' hit' : ' off'); d.id = 'cm'+i; d.style.top = CMY(i)+'px';
  d.innerHTML = '<div class="av" id="cav'+i+'">'+D.avatar(i*2+1)+'</div><div class="bub">'+
    '<div class="bar dk" style="left:24px;top:22px;width:'+(150+(i*41)%90)+'px;height:13px"></div>'+
    '<div class="bar" style="left:24px;top:50px;width:'+(330+(i*67)%170)+'px;height:13px;background:#D2C5B0"></div></div>'+
    (hit ? '<div class="ret" id="ret'+i+'"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="none" stroke="#fe4629" stroke-width="6"/>'+
      '<path d="M50 -2 V16 M50 84 V102 M-2 50 H16 M84 50 H102" stroke="#fe4629" stroke-width="6" stroke-linecap="round"/></svg></div>' : '');
  $('cms').appendChild(d);
}
/* ---------- tarjetas de contacto */
var ENV = '<svg viewBox="0 0 34 34"><rect x="3" y="7" width="28" height="20" rx="4" fill="#FFFDF8" stroke="#1C1A17" stroke-width="3.2"/><path d="M4 9 L17 19 L30 9" fill="none" stroke="#1C1A17" stroke-width="3.2" stroke-linejoin="round"/></svg>';
var PHN = '<svg viewBox="0 0 34 34"><rect x="9" y="3" width="16" height="28" rx="4" fill="#FFFDF8" stroke="#1C1A17" stroke-width="3.2"/><rect x="14" y="25" width="6" height="3" rx="1.5" fill="#1C1A17"/></svg>';
var TICK = '<svg viewBox="0 0 40 40"><path d="M11 21 L18 28 L30 13" fill="none" stroke="#FFFDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var KCY = function(k){ return 540 + k*170; };
for (var k=0;k<3;k++){
  var c = document.createElement('div'); c.className = 'ui-card soft kc'; c.id = 'kc'+k; c.style.top = KCY(k)+'px';
  c.innerHTML = '<div class="av" id="kav'+k+'">'+D.avatar(HIT[k]*2+1)+'</div>'+
    '<div class="ic" style="top:22px">'+ENV+'</div><div class="bar dk" style="left:214px;top:38px;width:'+(250-k*30)+'px;height:15px"></div>'+
    '<div class="ic" style="top:80px">'+PHN+'</div><div class="bar" style="left:214px;top:96px;width:'+(190+k*20)+'px;height:15px;background:#354B98"></div>'+
    '<div class="ok" id="ok'+k+'">'+TICK+'</div><div class="sheen" id="ksh'+k+'"></div>';
  $('kcs').appendChild(c);
}
/* ---------- gráfica */
var BH = [40,56,76,104,142,196,300,470];
for (var b=0;b<8;b++){ var e = document.createElement('div'); e.className = 'cb'+(b===7?' last':''); e.id='cb'+b;
  e.style.left = (6 + b*62)+'px'; e.style.height = BH[b]+'px'; $('chart').appendChild(e); }
/* ---------- cables comentario -> tarjeta */
var WP = [];
for (var k=0;k<3;k++){
  var y0 = CMY(HIT[k]) + 44, y1 = KCY(k) + 74;
  var p = document.createElementNS(NS,'path');
  p.setAttribute('d','M760 '+y0+' C 880 '+y0+', 880 '+y1+', 998 '+y1);
  p.setAttribute('stroke','#fe4629'); p.setAttribute('stroke-width','8'); p.setAttribute('stroke-linecap','round'); p.setAttribute('fill','none');
  $('wires').appendChild(p); WP.push(p);
}
/* ---------- avatares que vuelan del comentario a su tarjeta */
for (var k=0;k<3;k++){ var f = document.createElement('div'); f.className = 'av fly'; f.id = 'fly'+k; f.innerHTML = D.avatar(HIT[k]*2+1); $('flys').appendChild(f); }

/* ---------- COPIA: clon del estado final del sistema (el CSS por clase ES el estado final) */
var copy = $('sys').cloneNode(true);
copy.removeAttribute('id'); copy.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
var cw = document.createElement('div'); cw.id = 'copyWrap';
var rim = document.createElement('div'); rim.className = 'rim'; rim.id = 'rim';
cw.appendChild(rim); cw.appendChild(copy);
$('canvas').insertBefore(cw, $('scan'));

/* ---------- cámara, La mascota, partículas, cursor */
var view = D.Cam($('cam'), FX, FY - 570, {cx:380, cy:318, s:1.03, r:-2.5}, $('dotcam'), FY);
var mas  = D.Mascot($('mbox'), {x:-40, y:470, w:140, blinks:[0.3, 2.7, 4.8]});
var coins = D.Burst($('fx'), {x:1640, y:600, n:26, seed:93, t0:3.95, shape:'coin', colors:['#F5B82E','#F5B82E','#F5B82E','#2ece7d'], size:34, speed:900, dir:-1.2, spread:1.6, gravity:1900, life:1.2});
var sparks = D.Burst($('fx'), {x:2150, y:560, n:16, seed:5, t0:4.3, shape:'spark', colors:['#2ece7d','#F5B82E','#fe4629'], size:40, speed:760, gravity:500, life:0.7});
$('cur').innerHTML = D.CURSOR;
var SC = {y:520};                       // y del haz del escáner (lienzo)
var CP = {x:1200, y:1000, show:0, press:0};
function toScreen(px, py){ return {x: FX + view.s*(px - view.cx), y: FY + view.s*(py - view.cy)}; }
var FL = [0,1,2].map(function(){ return {u:0}; });
function flyPos(k, u){                 // arco del avatar: comentario -> tarjeta
  var x0 = 28, y0 = CMY(HIT[k]) + 12, x1 = 1024 + 17, y1 = KCY(k) + 24 + 17;
  var x = D.lerp(x0, x1, u), y = D.lerp(y0, y1, u) - Math.sin(Math.PI*u)*220;
  return {x:x, y:y, sc:1 + 0.5*Math.sin(Math.PI*u)};
}

function render(){
  var t = tl.time();
  view.paint(); mas.render(t); coins.update(t); sparks.update(t);
  gsap.set('#scan', {y:SC.y - 520});
  for (var k=0;k<3;k++){ var p = flyPos(k, FL[k].u); gsap.set('#fly'+k, {x:p.x, y:p.y, scale:p.sc}); }
  var sp = toScreen(CP.x, CP.y);
  gsap.set('#cur', {x:sp.x - 8, y:sp.y - 6, autoAlpha:CP.show, scale:1 - 0.14*CP.press});
  gsap.set('#plus', {x:sp.x + 28, y:sp.y + 38, autoAlpha:CP.press>0.5 || t>5.3 ? CP.show : 0});
}
var tl = gsap.timeline({paused:true, onUpdate:render});

/* ---------- estados iniciales de lo que entra después */
for (var i=0;i<5;i++) tl.set('#cm'+i, {autoAlpha:0}, 0);
HIT.forEach(function(i){ tl.set('#ret'+i, {autoAlpha:0}, 0); });
tl.set('#cms .cm', {opacity:1, filter:'grayscale(0)'}, 0);
tl.set('#cms .cm.hit .bub', {backgroundColor:'#F5EFE4', boxShadow:'inset 0 0 0 3px #E2D8C6'}, 0);
for (var k=0;k<3;k++){ tl.set('#kc'+k, {autoAlpha:0}, 0); tl.set('#ok'+k, {autoAlpha:0}, 0); tl.set('#kav'+k, {autoAlpha:0}, 0); tl.set('#fly'+k, {autoAlpha:0}, 0); }
WP.forEach(function(p){ var L=p.getTotalLength(); p.style.strokeDasharray=L+' '+L; gsap.set(p, {strokeDashoffset:L, opacity:0}); });
for (var b=0;b<8;b++) tl.set('#cb'+b, {scaleY:0}, 0);
tl.set('#cbase', {scaleX:0, transformOrigin:'0% 50%'}, 0);
tl.set('#post .rx', {scale:0}, 0); tl.set('#cdot', {scale:0}, 0);
tl.set(['#scan','#sel','#copyWrap','#gChart'], {autoAlpha:0}, 0);
tl.set(mas, {k:0}, 0);

/* 0.00 voz: presentar la situación. la tarjeta YA está y se asienta en 3D */
D.enter3d(tl, '#post', 0, {rx:14, ry:-14, z:-140, y:26, a0:1, dur:1.0, ir:true});
tl.to(view, {r:0, duration:1.0, ease:'power3.out'}, 0);
tl.to('#post .rx', {scale:1, duration:0.26, ease:'expo.out', stagger:0.06}, 0.1);
tl.to('#cdot', {scale:1, duration:0.22, ease:'expo.out'}, 0.36);
D.sheen(tl, '#sh0', 0.15, 0.9);

/* 0.45-1.50 "quién escribe": la cámara baja a los comentarios, que caen uno tras otro */
view.fly(tl, {cx:380, cy:790, s:0.98}, 0.45, 0.85, 'power3.inOut', 2.0);
for (var i=0;i<5;i++)
  tl.fromTo('#cm'+i, {autoAlpha:0, y:-60, scale:0.9}, {autoAlpha:1, y:0, scale:1, duration:0.36, ease:'expo.out', immediateRender:false}, 0.66 + i*0.13);

/* 1.40 "en tu bandeja": La mascota monta el escáner y barre los comentarios */
tl.to(mas, {k:1, duration:0.3, ease:'back.out(2)'}, 1.40);
tl.to('#scan', {autoAlpha:1, duration:0.12, ease:'none'}, 1.5);
tl.to(SC, {y:1060, duration:1.05, ease:'power1.inOut'}, 1.55);
tl.to(mas, {y:1010, duration:1.05, ease:'power1.inOut'}, 1.55);
tl.to(mas, {look:1, duration:0.2, ease:'power2.out'}, 1.55);
tl.to('#scan', {autoAlpha:0, duration:0.16, ease:'none'}, 2.62);
HIT.forEach(function(i){
  var tt = 1.55 + 1.05*((CMY(i)+80 - 520)/540);
  D.stamp(tl, '#ret'+i, tt, 0);
  tl.to('#cm'+i+' .bub', {backgroundColor:'#FFF1EC', boxShadow:'inset 0 0 0 4px #fe4629', duration:0.1, ease:'none'}, tt);
  tl.fromTo('#cm'+i, {x:0}, {x:14, duration:0.08, ease:'power2.out', immediateRender:false}, tt);
  tl.to('#cm'+i, {x:0, duration:0.22, ease:'power2.out'}, tt+0.09);
});
tl.to('#cms .cm.off', {opacity:0.3, filter:'grayscale(1)', duration:0.28, ease:'power2.out'}, 2.5);

/* 2.75 "los que encajan": whip a la derecha: los elegidos vuelan y se revelan sus contactos */
view.fly(tl, {cx:1250, cy:800, s:0.94}, 2.72, 0.6, 'power3.inOut', 3.2);
tl.to(mas, {boost:1, duration:0.1, ease:'power2.out'}, 2.74);
tl.to(mas, {x:1600, y:490, duration:0.62, ease:'power3.inOut'}, 2.76);
tl.to(mas, {boost:0, duration:0.2, ease:'power2.in'}, 3.4);
tl.to(mas, {look:-1, duration:0.2, ease:'power2.out'}, 3.4);
for (var k=0;k<3;k++){
  tl.set('#fly'+k, {autoAlpha:1}, 2.8 + k*0.06);
  tl.to(FL[k], {u:1, duration:0.5, ease:'power2.inOut'}, 2.8 + k*0.06);
  tl.set('#fly'+k, {autoAlpha:0}, 3.31 + k*0.06);
  tl.set('#kav'+k, {autoAlpha:1}, 3.31 + k*0.06);
  tl.set(WP[k], {opacity:1}, 2.84 + k*0.06);
  tl.to(WP[k], {strokeDashoffset:0, duration:0.4, ease:'power2.inOut'}, 2.84 + k*0.06);
  D.enter3d(tl, '#kc'+k, 2.98 + k*0.08, {rx:0, ry:-38, z:-220, x:-90, y:0, dur:0.5});
  D.sheen(tl, '#ksh'+k, 3.3 + k*0.08, 0.6);
  D.stamp(tl, '#ok'+k, 3.44 + k*0.09, 0);
}

/* 3.55-4.45 "...al mes": la gráfica se dispara y llueven monedas */
view.fly(tl, {cx:1640, cy:760, s:0.62}, 3.5, 0.75, 'power3.inOut', 1.4);
tl.to('#cbase', {scaleX:1, duration:0.3, ease:'expo.out'}, 3.62);
for (var b=0;b<8;b++) tl.to('#cb'+b, {scaleY:1, duration:0.34, ease:'expo.out'}, 3.7 + b*0.07);
tl.to('#gChart', {autoAlpha:1, duration:0.4, ease:'expo.out'}, 4.2);
tl.fromTo('#cb7', {filter:'brightness(1.7)'}, {filter:'brightness(1)', duration:0.4, ease:'power2.out', immediateRender:false}, 4.22);
tl.to(mas, {x:1720, y:560, duration:0.4, ease:'power2.inOut'}, 3.95);
tl.to(mas, {hop:1, duration:0.18, ease:'power2.out'}, 4.24);
tl.to(mas, {hop:0, duration:0.22, ease:'power2.in'}, 4.43);

/* 4.55 "y tú puedes": zoom out: el sistema entero, seleccionado */
view.fly(tl, {cx:1110, cy:540, s:0.355}, 4.5, 0.6, 'power3.inOut', 1.2);
tl.to('#gChart', {autoAlpha:0.45, duration:0.4, ease:'power2.out'}, 4.6);
tl.fromTo('#sel', {autoAlpha:0, scale:1.03, transformOrigin:'50% 50%'}, {autoAlpha:1, scale:1, duration:0.24, ease:'expo.out', immediateRender:false}, 4.86);

/* 5.15 "copiar el sistema": el cursor arrastra la COPIA hacia abajo */
tl.to(CP, {show:1, duration:0.1, ease:'none'}, 4.96);
